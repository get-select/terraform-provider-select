# Schema details tfplugingen-openapi cannot produce, applied to the generated
# code spec by ./tools/specpatch. See that command's doc comment for why this
# file exists rather than living in generator_config.v2.yml.
#
# Attribute sensitivity is deliberately absent: specpatch derives it from the
# OpenAPI document's x-terraform-sensitive markers, so marking a new secret in
# the API masks it here with no change to this file. specpatch matches the
# markers by property name only, so a marker on one schema masks every
# attribute of that name. `sensitive: false` on an attribute undoes that for an
# attribute that is not a secret (user_role.email).
#
# description_sources are the OpenAPI schemas a resource's descriptions are
# recovered from, in priority order. The generator drops the description of every
# property written as a nullable union, which is most of them; listing the
# request schema first means the wording a user reads describes the field as an
# input.
#
# Keys per resource:
#   description           - the resource's own description, which the generator omits
#   description_sources   - see above
#   attributes            - per-attribute overrides
#
# Keys per attribute:
#   requires_replace      - add a RequiresReplace plan modifier for the attribute's type
#   use_state_for_unknown - add a UseStateForUnknown plan modifier
#   <anything else>       - set verbatim on the code spec attribute

resources:
  snowflake_account:
    description: >-
      A connection to one Snowflake account: the credentials SELECT authenticates
      with, the role and warehouse it runs as, and how it exports data.

    description_sources:
      - SnowflakeAccountCreate
      - SnowflakeAccount

    attributes:
      # The Snowflake identifier is chosen by the caller and rejected by the API
      # if it changes, so a new value has to mean a new account.
      id:
        requires_replace: true

      # These describe the Snowflake account itself rather than SELECT's
      # configuration of it, so they cannot change while the id stays the same —
      # and a new id forces replacement. Holding them from state keeps them out
      # of the "known after apply" list on every unrelated update.
      #
      # Deliberately not listed: has_org_admin_access, has_data_share,
      # has_manage_warehouses_grant and mode_credentials_configured, which an
      # update can genuinely change, and etag and the timestamps, which change by
      # design.
      connection_id:
        use_state_for_unknown: true
      snowflake_organization_name:
        use_state_for_unknown: true
      snowflake_account_name:
        use_state_for_unknown: true
      snowflake_reader_parent_account_name:
        use_state_for_unknown: true
      locator:
        use_state_for_unknown: true
      account_region:
        use_state_for_unknown: true
      snowsight_url:
        use_state_for_unknown: true
      added_by_email:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

      # SELECT stores each of these exactly as given and returns it unchanged, so
      # the configuration is the only source for them.
      #
      # The generator makes them optional+computed because they appear in both the
      # request and the response, but optional+computed means a null in the
      # configuration keeps whatever the state already holds — so removing one of
      # these from a configuration would silently do nothing instead of clearing
      # the field. Plain optional is what makes a removal reach the API as the
      # null that clears it.
      #
      # This is safe only because the API does not derive these values. Anything
      # it computes must stay computed. excluded_users_filter_expression is the
      # one field it reshapes — it round-trips through json.loads — which the
      # resource absorbs by keeping the configured spelling when the two are the
      # same document.
      role:
        computed_optional_required: optional
      warehouse:
        computed_optional_required: optional
      describe_object_sproc_name:
        computed_optional_required: optional
      export_storage_integration_name:
        computed_optional_required: optional
      export_stage_name:
        computed_optional_required: optional
      compute_cost_per_credit:
        computed_optional_required: optional
      storage_cost_per_tb:
        computed_optional_required: optional
      customer_side_sanitization_database_schema:
        computed_optional_required: optional
      customer_side_sanitization_views:
        computed_optional_required: optional
      excluded_users_filter_expression:
        computed_optional_required: optional
      fivetran_users:
        computed_optional_required: optional
      mode_workspace:
        computed_optional_required: optional
      mode_token_id:
        computed_optional_required: optional

      # The API never returns a secret, so these can only ever hold what the
      # configuration says. Leaving them computed would promise a value that no
      # read can supply.
      credentials.username:
        computed_optional_required: optional
      credentials.password:
        computed_optional_required: optional
      credentials.private_key:
        computed_optional_required: optional
      credentials.private_key_passphrase:
        computed_optional_required: optional
      mode_token_secret:
        computed_optional_required: optional

  databricks_connection:
    description: >-
      A connection to one Databricks account: the workspace SELECT reads through,
      the SQL warehouse it runs its queries on, and the service principal it
      authenticates as.

    description_sources:
      - DatabricksConnectionCreate
      - DatabricksConnection

    attributes:
      # Absent from DatabricksConnectionUpdate entirely — the account a connection
      # reads cannot change once it has been added, so a new value has to mean a
      # new connection.
      databricks_account_id:
        requires_replace: true

      # SELECT assigns each of these once, when the connection is added, and never
      # changes it afterwards. Holding them from state keeps them out of the
      # "known after apply" list on every unrelated update.
      #
      # Deliberately not listed: etag and update_time, which change by design (and
      # move when the parent connection row changes, so a rename or a sync toggle
      # bumps them); metastore, which is re-resolved whenever a workspace,
      # warehouse or credential change triggers revalidation; workspace_ids, which
      # accumulates as SELECT discovers activity; and last_successful_sync_time,
      # which moves as syncs run.
      id:
        use_state_for_unknown: true
      connection_id:
        use_state_for_unknown: true
      added_by_email:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  bigquery_connection:
    description: >-
      A connection to one BigQuery project: the project and dataset SELECT reads,
      the billing account its exports belong to, and the service account it
      impersonates to reach them.

    description_sources:
      - BigQueryConnectionCreate
      - BigQueryConnection

    attributes:
      # SELECT stores each of these exactly as given and returns it unchanged.
      #
      # The generator makes them optional+computed because they appear in both
      # the request and the response, but optional+computed means a null in the
      # configuration keeps whatever state already holds — so removing one of
      # these from a configuration would silently do nothing instead of
      # reaching the API as the null that clearing it requires (the same fix
      # already applied to the Snowflake account resource, for the same
      # reason). Plain optional is what makes a removal reach the API at all.
      # A connection this resource can create is never DoiT-managed (is_doit
      # is out of scope — see generator_config.v2.yml), so the API will always
      # reject clearing either field; a rejected request is still a real
      # signal, where a silent no-op is none.
      # The OpenAPI pattern for this field is `^[a-zA-Z0-9_]{1,1024}$`. Go's
      # regexp package refuses to compile a repeat count above 1000 (RE2's
      # limit), which crashes the provider on startup rather than merely
      # failing one plan. Capping the client-side pattern at some smaller
      # number would validate a bound the API does not actually enforce, so
      # the length is dropped here and left entirely to the API, keeping only
      # the part of the rule Go can check: the character class.
      bigquery_dataset_id:
        computed_optional_required: optional
        validators:
          - custom:
              imports:
                - path: regexp
                - path: github.com/hashicorp/terraform-plugin-framework-validators/stringvalidator
              schema_definition: stringvalidator.RegexMatches(regexp.MustCompile("^[a-zA-Z0-9_]+$"), "")
      billing_account_id:
        computed_optional_required: optional

      # SELECT assigns or resolves each of these once and does not change it on an
      # unrelated update. Holding them from state keeps them out of "known after
      # apply" on every other change.
      #
      # Deliberately not listed: etag and update_time, which change by design;
      # gcp_organization_id, gcp_organization_name and regions, which re-resolve
      # whenever an access-related update revalidates against BigQuery (unlike
      # Snowflake's equivalent fields, gcp_project_id is mutable in place here, so
      # these can genuinely move); doit_billing_status and
      # last_successful_sync_time, which move as SELECT confirms access and syncs
      # run.
      id:
        use_state_for_unknown: true
      connection_id:
        use_state_for_unknown: true
      added_by_email:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  budget:
    description: >-
      A spend threshold over a recurring or fixed period, optionally narrowed to a
      team and to a slice of spend.

    # BudgetV2 is the component key of the read model; its OpenAPI title is
    # "Budget". specpatch resolves description_sources by component key, so
    # "Budget" here would fail the build.
    description_sources:
      - BudgetCreate
      - BudgetV2

    attributes:
      # team_id and filter_expression_json are the only fields this resource lets
      # a caller clear. The generator makes them optional+computed because they
      # appear in both the request and the response, but optional+computed means
      # a null in the configuration keeps whatever state already holds — so
      # removing one of these from a configuration would silently do nothing
      # instead of reaching the API as the null that clears it. Plain optional is
      # what makes a removal reach the API at all.
      #
      # started_at is deliberately not listed here even though the API also
      # returns it: SELECT assigns it when omitted from a create, and BudgetPatch
      # 422s on an explicit null for it, so it must stay optional+computed.
      team_id:
        computed_optional_required: optional
      filter_expression_json:
        computed_optional_required: optional

      # id and created_by are set once, when the budget is created, and never
      # change afterwards. Holding them from state keeps them out of the "known
      # after apply" list on every unrelated update.
      #
      # Deliberately not listed: status, which the server clears whenever
      # amount, period or the filter changes; etag, update_time and updated_by,
      # which change by design; and current_period_start, current_period_end and
      # budget_end_date, which are recomputed from period on every read and move
      # with the calendar even when nothing about the budget itself changes.
      id:
        use_state_for_unknown: true
      created_by:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  aws_connection:
    description: >-
      A connection to one AWS payer account: the S3 location AWS delivers its Cost
      and Usage Report to, and the IAM user SELECT reads that report as.

    description_sources:
      - AwsAccountCreate
      - AwsAccount

    attributes:
      # Nothing here is marked requires_replace, unlike every other v2 connection.
      # AwsAccountCreate and AwsAccountUpdate cover exactly the same fields, so
      # there is no creation-only value a change would have to replace the
      # connection over — not even payer_account_id, which the API moves in place
      # and merely revalidates against S3.

      # s3_prefix is the one field on this resource the API lets you clear, and
      # the only one that has to be plain optional rather than the
      # computed_optional the generator produces for a field appearing in both the
      # request and the response. computed_optional means a null in the
      # configuration keeps whatever state already holds, so removing s3_prefix
      # from a configuration would silently leave the connection reading the old
      # prefix instead of moving it to the root of the bucket. Plain optional is
      # what makes a removal reach the API as the null that clears it.
      #
      # Safe here for the same reason it is safe for the Snowflake fields above:
      # SELECT stores the value exactly as given and returns it unchanged.
      s3_prefix:
        computed_optional_required: optional

      # SELECT assigns each of these once, when the connection is added, and never
      # changes it afterwards. Holding them from state keeps them out of the
      # "known after apply" list on every unrelated update.
      #
      # Deliberately not listed: etag and update_time, which change by design (and
      # move when the parent connection row changes, so a rename or a sync toggle
      # bumps them); and last_successful_sync_time, which moves as syncs run.
      id:
        use_state_for_unknown: true
      connection_id:
        use_state_for_unknown: true
      added_by_email:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  usage_group_set:
    description: >-
      A named collection of usage groups, which together attribute an
      organization's spend. A set holds a linear history of versions; the newest
      version holds the live groups, and the rest are frozen checkpoints.

    description_sources:
      - UsageGroupSetCreateV2
      - UsageGroupSetV2

    attributes:
      # team_id is the one field on this resource the API lets a caller clear.
      # The generator makes it optional+computed because it appears in both the
      # request and the response, but optional+computed means a null in the
      # configuration keeps whatever state already holds — so removing team_id
      # from a configuration would leave the set on its old team instead of
      # unowning it. Plain optional is what makes a removal reach the API as the
      # null that clears it.
      team_id:
        computed_optional_required: optional

      # SELECT assigns the id once, when the set is created, and never changes it.
      # Holding it from state keeps it out of the "known after apply" list on every
      # unrelated update.
      #
      # Deliberately not listed: etag, which changes by design; version, which
      # goes up whenever a version is recorded — once per apply that touches this
      # set's groups; and insights_sync_pending, which the nightly sync clears on
      # its own schedule.
      id:
        use_state_for_unknown: true

  usage_group:
    description: >-
      One group within a usage group set: a filter over the organization's spend,
      an optional budget for what it matches, and the precedence it takes when its
      filter overlaps another group's.

    description_sources:
      - UsageGroupCreateV2
      - UsageGroupV2

    attributes:
      # usage_group_set_id is the set this group belongs to, and the generator
      # gets it wrong in both directions. UsageGroupV2 marks it readOnly, so the
      # generator makes it computed — but it is how a configuration says which set
      # to create the group in, and it is a path parameter on every one of this
      # resource's routes, so it has to be required. And UsageGroupUpdateV2 does
      # not carry it, so the API has no way to move a group between sets: a change
      # has to replace the group.
      usage_group_set_id:
        computed_optional_required: required
        requires_replace: true

      # A usage group always has a filter — UsageGroupCreateV2 demands exactly one
      # of filter_expression or filter_expression_json, and filter_expression is
      # ignored by the generator (see generator_config.v2.yml), leaving this
      # attribute as the only way to supply one. The generator makes it
      # optional+computed because it appears in both the request and the response.
      filter_expression_json:
        computed_optional_required: required

      # budget is the one field on this resource the API lets a caller clear.
      # The generator makes it optional+computed because it appears in both the
      # request and the response, but optional+computed means a null in the
      # configuration keeps whatever state already holds — so removing budget
      # from a configuration would leave the group's old budget in place instead
      # of clearing it. Plain optional is what makes a removal reach the API as
      # the null that clears it.
      budget:
        computed_optional_required: optional

      # SELECT assigns these once, when the group is created, and never changes
      # them. Holding them from state keeps them out of the "known after apply"
      # list on every unrelated update.
      #
      # Deliberately not listed: etag and update_time, which change by design.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  team:
    description: >-
      A team in the organization. A team groups users and SSO groups, so that a
      role granted to the team applies to all of its members.

    description_sources:
      - TeamCreateV2
      - TeamV2

    attributes:
      # TeamCreateV2 gives default_member_role a default of editor, but the
      # property is a $ref, and the generator drops a default it finds next to
      # one. Without this the attribute stays unknown until apply.
      default_member_role:
        default:
          static: editor

      # SELECT assigns these once, when the team is created, and does not
      # change them. Holding them from state keeps them out of the "known after
      # apply" list on every unrelated update.
      #
      # Deliberately not listed: etag and update_time, which change by design.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  team_member:
    description: >-
      One member of a team: a user, identified by email address, or an SSO
      group, identified by its name. Use one of these per member, for example
      with `for_each` over a list of email addresses.

    description_sources:
      - TeamMemberCreateV2
      - TeamMemberV2

    attributes:
      # team_id is a path parameter on every route. TeamMemberV2 does not carry
      # it, so the generator makes it optional+computed — but a member cannot
      # be added without naming its team. TeamMemberUpdateV2 does not carry it
      # either, so the API cannot move a member between teams: a change has to
      # replace the member.
      team_id:
        computed_optional_required: required
        requires_replace: true

      # TeamMemberUpdateV2 carries only role, so a change to either of these
      # has to replace the member.
      type:
        requires_replace: true
      identifier:
        requires_replace: true

      # Same $ref default the generator drops on team.default_member_role.
      role:
        default:
          static: editor

      # SELECT assigns these once, when the member is added, and does not
      # change them.
      #
      # Deliberately not listed: etag, which changes by design.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  team_role:
    description: >-
      One role granted to a team, on the whole organization or on one resource.
      Every member of the team holds the role. Use one of these per grant.

    description_sources:
      - TeamRoleGrantCreateV2
      - TeamRoleGrantV2

    attributes:
      # team_id is a path parameter on every route. TeamRoleGrantV2 does not
      # carry it, so the generator makes it optional+computed, but a grant
      # cannot be made without naming its team.
      team_id:
        computed_optional_required: required
        requires_replace: true

      # The API has no update route for a team role grant, so a new role has
      # to replace the grant.
      role:
        requires_replace: true

      # SELECT assigns these once, when the role is granted, and does not
      # change them.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  user_role:
    description: >-
      One role granted directly to a user, identified by email address, on the
      whole organization or on one resource. Use one of these per grant.

    description_sources:
      - UserRoleGrantCreateV2
      - UserRoleGrantV2

    attributes:
      # email is a path parameter on every route, and UserRoleGrantV2 does not
      # carry it. UserRoleGrantUpdateV2 carries only role, so a new email has
      # to replace the grant.
      #
      # JiraTokenConnectRequest marks its own `email` property
      # x-terraform-sensitive, and specpatch matches the marker by name. A
      # user's email address is not a secret, and select_team_member shows its
      # identifier in a plan, so this attribute is not masked either.
      email:
        computed_optional_required: required
        requires_replace: true
        sensitive: false

      # SELECT assigns these once, when the role is granted, and does not
      # change them.
      #
      # Deliberately not listed: etag and update_time, which change by design.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true

  default_role:
    description: >-
      One role that every member of the organization holds by default, on the
      whole organization or on one resource. Use one of these per grant.

    description_sources:
      - DefaultRoleGrantCreateV2
      - DefaultRoleGrantV2

    attributes:
      # The API has no update route for a default role grant, so a new role
      # has to replace the grant.
      role:
        requires_replace: true

      # SELECT assigns these once, when the role is granted. Nothing can
      # update a default grant through this provider, but the API can still
      # change the etag and update_time, so those two are not listed.
      id:
        use_state_for_unknown: true
      create_time:
        use_state_for_unknown: true
