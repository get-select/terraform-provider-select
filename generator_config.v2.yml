# SPDX-License-Identifier: MPL-2.0

# Generator config for the SELECT API v2 surface (https://api.select.dev/v2),
# which every resource in this provider is built from.
#
# tfplugingen-openapi's `overrides` only supports `description` (its Override
# struct has a single field). Everything the schema needs beyond that — sensitive
# attributes, server-side defaults, plan modifiers — is applied afterwards by
# ./tools/specpatch from generator_overrides.v2.yml.

provider:
  name: select

resources:
  snowflake_account:
    create:
      path: /snowflake-accounts
      method: POST
    read:
      path: /snowflake-accounts/{snowflake_account_id}
      method: GET
    update:
      path: /snowflake-accounts/{snowflake_account_id}
      method: PATCH
    delete:
      path: /snowflake-accounts/{snowflake_account_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          snowflake_account_id: id
        overrides:
          id:
            description: >-
              The account's Snowflake identifier, in ORGANIZATION-ACCOUNT form (e.g.
              acme-us-east-1). Must already be normalized: lower case, no surrounding
              whitespace, and `-` rather than `.` between organization and account. A
              PrivateLink identifier, which ends in `.privatelink`, keeps its dots.
              Changing this forces a new Snowflake account to be added.
          credentials:
            description: >-
              How SELECT authenticates to the account. The secrets in this block are
              stored in a secret store and never returned by the API, so SELECT cannot
              detect changes made to them outside Terraform.
          etag:
            description: >-
              Opaque strong ETag for this account. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  databricks_connection:
    create:
      path: /databricks-connections
      method: POST
    read:
      path: /databricks-connections/{databricks_connection_id}
      method: GET
    update:
      path: /databricks-connections/{databricks_connection_id}
      method: PATCH
    delete:
      path: /databricks-connections/{databricks_connection_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          databricks_connection_id: id
        overrides:
          id:
            description: >-
              The connection's identifier in SELECT, assigned when it is added. Use it
              with `terraform import` to bring an existing connection under management.
          credentials:
            description: >-
              The service principal SELECT authenticates as. The secret in this block is
              stored in a secret store and never returned by the API, so SELECT cannot
              detect changes made to it outside Terraform.
          etag:
            description: >-
              Opaque strong ETag for this connection. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  bigquery_connection:
    create:
      path: /bigquery-connections
      method: POST
    read:
      path: /bigquery-connections/{bigquery_connection_id}
      method: GET
    update:
      path: /bigquery-connections/{bigquery_connection_id}
      method: PATCH
    delete:
      path: /bigquery-connections/{bigquery_connection_id}
      method: DELETE
    schema:
      # is_doit is out of scope for this resource: a DoiT-managed connection is
      # never created or managed through Terraform (creating one needs a
      # signed-in user's credential, which this provider never holds, and in
      # practice neither DoiT staff nor customers manage one this way). See
      # generator_overrides.v2.yml for what that implies for
      # bigquery_dataset_id and billing_account_id.
      ignores:
        - is_doit
      attributes:
        aliases:
          bigquery_connection_id: id
        overrides:
          id:
            description: >-
              The connection's identifier in SELECT, assigned when it is added. Use it
              with `terraform import` to bring an existing connection under management.
          etag:
            description: >-
              Opaque strong ETag for this connection. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.
          # The API's own descriptions for these two mention is_doit, which this
          # resource has no attribute for (see the ignores entry above) — a
          # reference the reader would have no way to look up. Reworded to drop
          # it rather than leave a dangling mention of a hidden flag.
          bigquery_dataset_id:
            description: >-
              The BigQuery dataset holding the project's billing and pricing exports.
              Letters, digits and underscores only.
          billing_account_id:
            description: >-
              The Cloud Billing account the exports belong to, in `XXXXXX-XXXXXX-XXXXXX`
              form, case-insensitive.
          doit_billing_status:
            description: >-
              Always null for a connection managed by this resource. Only set on a
              DoiT-managed connection, which is out of this resource's scope — see
              "DoiT-managed connections are out of scope" below.

  aws_connection:
    create:
      path: /aws-accounts
      method: POST
    read:
      path: /aws-accounts/{aws_account_id}
      method: GET
    update:
      path: /aws-accounts/{aws_account_id}
      method: PATCH
    delete:
      path: /aws-accounts/{aws_account_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          aws_account_id: id
        overrides:
          id:
            description: >-
              The connection's identifier in SELECT, assigned when it is added. Use it
              with `terraform import` to bring an existing connection under management.
          credentials:
            description: >-
              The IAM user SELECT authenticates as when it reads the Cost and Usage
              Report. The secret in this block is stored in a secret store and never
              returned by the API, so SELECT cannot detect changes made to it outside
              Terraform.
          etag:
            description: >-
              Opaque strong ETag for this connection. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  budget:
    create:
      path: /budgets
      method: POST
    read:
      path: /budgets/{budget_id}
      method: GET
    update:
      path: /budgets/{budget_id}
      method: PATCH
    delete:
      path: /budgets/{budget_id}
      method: DELETE
    schema:
      # period is a oneOf discriminated on schedule_type. Left un-ignored,
      # tfplugingen-openapi answers "schema composition is currently not
      # supported" and drops the entire budget resource from the code spec, so
      # the attribute is hand-written in budget_resource.go instead.
      #
      # filter_expression is a recursive 8-way anyOf, beyond generating at all.
      # The API also 422s ("Use exactly one of filter_expression or
      # filter_expression_json") if both keys are present in a request, and
      # Pydantic counts an explicit null as present — so this resource must never
      # emit the key, and filter_expression_json is its whole filter surface.
      ignores:
        - period
        - filter_expression
      attributes:
        aliases:
          budget_id: id
        overrides:
          id:
            description: >-
              The budget's identifier in SELECT, assigned when it is created. Use it
              with `terraform import` to bring an existing budget under management.
          name:
            description: The budget's display name.
          etag:
            description: >-
              Opaque strong ETag for this budget. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.
          filter_expression_json:
            description: >-
              A JSON-encoded filter narrowing which spend counts toward the budget.
              Null counts all spend. The root of the filter must be a group —
              `{"operator": "and"|"or", "filters": [...]}` — not a single leaf filter.

  usage_group_set:
    create:
      path: /usage-group-sets
      method: POST
    read:
      path: /usage-group-sets/{usage_group_set_id}
      method: GET
    update:
      path: /usage-group-sets/{usage_group_set_id}
      method: PATCH
    delete:
      path: /usage-group-sets/{usage_group_set_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          usage_group_set_id: id
        overrides:
          id:
            description: >-
              The set's identifier in SELECT, assigned when it is created. Use it with
              `terraform import` to bring an existing set under management.
          name:
            description: >-
              The set's display name. Must be unique within the organization; the API
              compares names ignoring case and surrounding whitespace, so "Engineering"
              and "  engineering  " conflict.
          order:
            description: >-
              Where the set sorts among the organization's other sets. Lower sorts first.
          team_id:
            description: >-
              The team the set belongs to. Null leaves it unowned.
          public:
            description: Whether everyone in the organization can see the set.
          version:
            description: >-
              How many versions the set has. A version is a frozen copy of the set's
              usage groups; this provider records one per apply that changes them,
              capturing the state that apply started from. See "Versioning" below.
          etag:
            description: >-
              Opaque strong ETag for this set. Sent as `If-Match` on updates and deletes
              so a change made outside Terraform cannot be silently overwritten.
          insights_sync_pending:
            description: >-
              Whether the set has changed since the nightly job last synced usage groups
              onto insights. Insight rows may lag the current definitions by up to about
              36 hours while this is true.

  usage_group:
    create:
      path: /usage-group-sets/{usage_group_set_id}/usage-groups
      method: POST
    read:
      path: /usage-group-sets/{usage_group_set_id}/usage-groups/{usage_group_id}
      method: GET
    update:
      path: /usage-group-sets/{usage_group_set_id}/usage-groups/{usage_group_id}
      method: PATCH
    delete:
      path: /usage-group-sets/{usage_group_set_id}/usage-groups/{usage_group_id}
      method: DELETE
    schema:
      # filter_expression is a recursive 8-way anyOf, beyond generating at all, so
      # filter_expression_json is this resource's whole filter surface — the same
      # arrangement budgets use. The API 422s ("Use exactly one of
      # filter_expression or filter_expression_json") when both keys are present,
      # and counts an explicit null as present, so this resource must never emit
      # the key at all.
      ignores:
        - filter_expression
      attributes:
        aliases:
          usage_group_id: id
        overrides:
          id:
            description: >-
              The group's identifier in SELECT, assigned when it is created. Use it with
              `terraform import` — as `usage_group_set_id/id` — to bring an existing
              group under management.
          usage_group_set_id:
            description: >-
              The set this group belongs to. Changing it forces a new group, since the
              API does not move a group between sets.
          name:
            description: >-
              The group's display name. The API does not require this to be unique;
              two groups in the same set may share a name.
          filter_expression_json:
            description: >-
              A JSON-encoded filter choosing which spend is attributed to this group.
              The root must be a group — `{"operator": "and"|"or", "filters": [...]}` —
              rather than a single leaf filter. Which fields a filter can name depends
              on the set's scope; see "Filter Expressions" below.
          budget:
            description: >-
              The group's budget in credits. Null means the group has no budget.
          order:
            description: >-
              Both the display order and the cost allocation precedence within the set.
              Where two groups' filters overlap, spend is attributed to the one with the
              lower order. Prefer unique values within a set.
          etag:
            description: >-
              Opaque strong ETag for this group. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.
          create_time:
            description: When the group was created — RFC 3339 UTC.
          update_time:
            description: >-
              RFC 3339 UTC. SELECT does not currently advance this when the
              group's fields change, so compare etag to detect a change.

  team:
    create:
      path: /teams
      method: POST
    read:
      path: /teams/{team_id}
      method: GET
    update:
      path: /teams/{team_id}
      method: PATCH
    delete:
      path: /teams/{team_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          team_id: id
        overrides:
          id:
            description: >-
              The team's identifier in SELECT, assigned when it is created. Use it with
              `terraform import` to bring an existing team under management.
          default_member_role:
            description: >-
              The default role for members added to this team: `admin`, `editor` or
              `viewer`. Defaults to `editor`. `select_team_member` always sends its own
              `role`, so this default does not apply to the members Terraform adds.
          is_all_users:
            description: >-
              Whether the team automatically includes every organization member.
              Defaults to `false`.
          etag:
            description: >-
              Opaque strong ETag for this team. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  team_member:
    create:
      path: /teams/{team_id}/members
      method: POST
    # The API has no GET for one member. The read operation here only supplies
    # the schema, and the create operation has the same response (TeamMemberV2)
    # and the same team_id path parameter. The resource reads a member from the
    # team's member list. See team_member_resource.go.
    read:
      path: /teams/{team_id}/members
      method: POST
    update:
      path: /teams/{team_id}/members/{member_id}
      method: PATCH
    delete:
      path: /teams/{team_id}/members/{member_id}
      method: DELETE
    schema:
      attributes:
        aliases:
          member_id: id
        overrides:
          id:
            description: >-
              The membership's identifier in SELECT, assigned when the member is added.
              Use it with `terraform import`, as `team_id/id`, to bring an existing
              member under management.
          team_id:
            description: >-
              The team to add the member to. Changing it removes the member from the
              old team and adds it to the new one.
          type:
            description: >-
              Whether the member is an individual user (`user`) or an SSO group
              (`sso_group`). Changing it forces a new member.
          identifier:
            description: >-
              The user's email address, or the SSO group's name as the identity
              provider reports it. Changing it forces a new member.
          role:
            description: >-
              The member's role within the team: `admin`, `editor` or `viewer`.
              Defaults to `editor`. Changes in place.
          etag:
            description: >-
              Opaque strong ETag for this membership. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  # The three role grant resources share one grant shape: a role and an
  # optional scope. The scope is hand-written (see role_grant_scope.go),
  # because the request takes RoleGrantScope {type, id} but the response gives
  # an entity object and three flat columns. All of these are ignored here, and
  # each resource injects the hand-written scope attribute into its schema.
  team_role:
    create:
      path: /teams/{team_id}/roles
      method: POST
    # The API has no GET for one team role grant. The read operation here
    # only supplies the schema, and the create operation has the same response
    # (TeamRoleGrantV2) and the same team_id path parameter. The resource
    # reads a grant from the team's grant list. See team_role_resource.go.
    read:
      path: /teams/{team_id}/roles
      method: POST
    # No update: the API cannot change a team role grant, so every attribute
    # forces a new grant.
    delete:
      path: /teams/{team_id}/roles/{role_id}
      method: DELETE
    schema:
      ignores:
        - scope
        - entity
        - snowflake_organization_name
        - snowflake_account_uuid
        - usage_group_id
      attributes:
        aliases:
          role_id: id
        overrides:
          id:
            description: >-
              The grant's identifier in SELECT, assigned when the role is granted. Use it
              with `terraform import`, as `team_id/id`, to bring an existing grant under
              management.
          team_id:
            description: >-
              The team to grant the role to. Every member of the team holds the role.
              Changing it forces a new grant.
          role:
            description: >-
              The role to grant: `admin`, `editor`, `monitor_editor`, `viewer` or
              `team_creator`. A `usage_group` scope accepts only `viewer`. Changing it
              forces a new grant.

  user_role:
    create:
      path: /users/{email}/roles
      method: POST
    read:
      path: /users/{email}/roles/{role_id}
      method: GET
    update:
      path: /users/{email}/roles/{role_id}
      method: PATCH
    delete:
      path: /users/{email}/roles/{role_id}
      method: DELETE
    schema:
      # is_default and granted_from_team_name describe grants this resource
      # does not manage: a grant it manages is always direct. See
      # user_role_api.go.
      ignores:
        - scope
        - entity
        - snowflake_organization_name
        - snowflake_account_uuid
        - usage_group_id
        - is_default
        - granted_from_team_name
      attributes:
        aliases:
          role_id: id
        overrides:
          id:
            description: >-
              The grant's identifier in SELECT, assigned when the role is granted. Use it
              with `terraform import`, as `email/id`, to bring an existing grant under
              management.
          email:
            description: >-
              The email address of the user to grant the role to. The user does not have
              to have signed in yet: the grant takes effect when they first sign in.
              Changing it forces a new grant.
          role:
            description: >-
              The role to grant: `admin`, `editor`, `monitor_editor`, `viewer` or
              `team_creator`. Changes in place.
          etag:
            description: >-
              Opaque strong ETag for this grant. Sent as `If-Match` on updates and
              deletes so a change made outside Terraform cannot be silently overwritten.

  default_role:
    create:
      path: /default-roles
      method: POST
    # The API has no GET for one default role grant. As for team_role, the
    # create operation supplies the schema, and the resource reads a grant
    # from the list of default grants. See default_role_resource.go.
    read:
      path: /default-roles
      method: POST
    # No update: the API cannot change a default role grant, so every
    # attribute forces a new grant.
    delete:
      path: /default-roles/{role_id}
      method: DELETE
    schema:
      ignores:
        - scope
        - entity
        - snowflake_organization_name
        - snowflake_account_uuid
        - usage_group_id
      attributes:
        aliases:
          role_id: id
        overrides:
          id:
            description: >-
              The grant's identifier in SELECT, assigned when the role is granted. Use it
              with `terraform import` to bring an existing grant under management.
          role:
            description: >-
              The role every organization member holds: `admin`, `editor`,
              `monitor_editor`, `viewer` or `team_creator`. Changing it forces a new
              grant.
          etag:
            description: >-
              Opaque strong ETag for this grant. Sent as `If-Match` on deletes so a
              change made outside Terraform cannot be silently overwritten.

  # An SSO group carries its roles inline. The API requires at least one role
  # on create and refuses to revoke the last one, so the roles cannot be a
  # separate resource. roles is ignored here, because the request takes
  # RoleGrantScope {type, id} but the grant list returns an entity object and
  # three flat columns. The resource injects a hand-written roles set. See
  # sso_group_resource.go.
  sso_group:
    create:
      path: /sso-groups
      method: POST
    read:
      path: /sso-groups/{sso_group_id}
      method: GET
    update:
      path: /sso-groups/{sso_group_id}
      method: PATCH
    delete:
      path: /sso-groups/{sso_group_id}
      method: DELETE
    schema:
      ignores:
        - roles
      attributes:
        aliases:
          sso_group_id: id
        overrides:
          id:
            description: >-
              The group's identifier in SELECT, which is always the same as `name`. A
              rename changes it. Use the name with `terraform import` to bring an
              existing group under management.
          name:
            description: >-
              The group name, exactly as your identity provider reports it. Members of
              the identity provider group receive the roles at their next login.
              Changes in place: SELECT renames the group and keeps its roles.
          etag:
            description: >-
              Opaque strong ETag for this group. Sent as `If-Match` on renames and
              deletes so a change made outside Terraform cannot be silently
              overwritten. A role change also changes it.
          create_time:
            description: >-
              When the group's earliest role was granted — RFC 3339 UTC. It can change
              when that role is revoked.
          update_time:
            description: When any of the group's roles last changed — RFC 3339 UTC.
